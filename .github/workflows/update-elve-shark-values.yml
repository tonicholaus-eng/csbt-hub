name: Update Elve Shark Values

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-elve-shark-values
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch and validate Elve Shark values
        run: npm run update:elve

      - name: Regenerate website data
        run: npm run generate:data

      - name: Run data validation
        run: npm run data:validate

      - name: Commit updated values
        run: |
          if git diff --quiet -- source-data/elve-shark-values.json src/data/tradingItems.json src/data/valueSources.json src/data/homePopularItems.json; then
            echo "No value changes detected."
            exit 0
          fi
          git config user.name "csbt-value-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A \
            source-data/elve-shark-values.json \
            source-data/elve-shark-values.backup.json \
            source-data/trading-data-validation.json \
            src/data/tradingItems.json \
            src/data/valueSources.json \
            src/data/tradingMeta.json \
            src/data/homePopularItems.json
          git commit -m "chore: update Elve Shark values"
          git push
